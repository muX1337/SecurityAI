[project]
name = "cmdi-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "pyyaml>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
